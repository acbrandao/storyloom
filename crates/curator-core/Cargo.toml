[package]
name = "curator-core"
description = "UI-independent core of StoryLoom: catalog, scanning, metadata, thumbnails, timestamp-safe file operations."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
r2d2 = "0.8"
r2d2_sqlite = { version = "0.36", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "macros", "time", "fs"] }
tokio-util = "0.7"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "gif", "webp", "bmp"] }
imagesize = "0.15"
blake3 = "1"
filetime = "0.2"
regex = "1"
libc = "0.2"
trash = "5"

[dev-dependencies]
tempfile = "3"
walkdir = "2"
