name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Install npm dependencies
        run: npm ci
      - name: Typecheck and build the UI
        run: npm run build
      - name: Core tests (pipeline, timestamps, organize, clips)
        run: cargo test -p curator-core
      - name: App shell tests
        run: cargo test -p media-curator
